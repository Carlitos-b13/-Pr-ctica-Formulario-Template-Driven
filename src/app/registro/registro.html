<div class="contenedor">

  <h1>Formulario de Registro</h1>

  <form #formulario="ngForm" (ngSubmit)="registrar()">

    <div class="campo">
      <label for="nombre">Nombre completo:</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        [(ngModel)]="usuario.nombre"
        required
        placeholder="Ingresa tu nombre completo">
    </div>

    <div class="campo">
      <label for="correo">Correo electrónico:</label>
      <input
        type="email"
        id="correo"
        name="correo"
        [(ngModel)]="usuario.correo"
        required
        placeholder="ejemplo@correo.com">
    </div>

    <div class="campo">
      <label for="telefono">Teléfono:</label>
      <input
        type="tel"
        id="telefono"
        name="telefono"
        [(ngModel)]="usuario.telefono"
        required
        placeholder="Ingresa tu teléfono">
    </div>

    <div class="campo">
      <label for="edad">Edad:</label>
      <input
        type="number"
        id="edad"
        name="edad"
        [(ngModel)]="usuario.edad"
        required
        min="1"
        max="120"
        placeholder="Ingresa tu edad">
    </div>

    <div class="campo">
      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        name="password"
        [(ngModel)]="usuario.password"
        required
        placeholder="Ingresa una contraseña">
    </div>

    <div class="campo">
      <label for="confirmarPassword">Confirmación de contraseña:</label>
      <input
        type="password"
        id="confirmarPassword"
        name="confirmarPassword"
        [(ngModel)]="usuario.confirmarPassword"
        required
        placeholder="Confirma tu contraseña">
    </div>

    <button type="submit" [disabled]="formulario.invalid">
      Registrar
    </button>

  </form>

  @if (registrado) {
    <div class="resultado">

      <h2>Datos registrados</h2>

      <p><strong>Nombre completo:</strong> {{ usuario.nombre }}</p>
      <p><strong>Correo electrónico:</strong> {{ usuario.correo }}</p>
      <p><strong>Teléfono:</strong> {{ usuario.telefono }}</p>
      <p><strong>Edad:</strong> {{ usuario.edad }}</p>
      <p><strong>Contraseña:</strong> {{ usuario.password }}</p>
      <p><strong>Confirmación:</strong> {{ usuario.confirmarPassword }}</p>

    </div>
  }

</div>
